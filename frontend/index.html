<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F5C4D">
  <title>맛집·명소 안내</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 검색창 (모든 화면 공통) -->
  <header class="topbar">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="search-input" type="search" placeholder="맛집, 명소, 축제 검색" autocomplete="off">
    </label>
  </header>

  <main>
    <!-- 홈 -->
    <section id="home" class="page" aria-label="홈">
      <h1 class="greeting">오늘은 어디로 떠날까요?</h1>
      <p id="home-notice" class="notice-line" role="status" hidden></p>

      <div class="weather" id="weather-card">
        <b>--°</b>
        <span>날씨 정보 자리<br>(나중에 기상청 정보가 들어옵니다)</span>
      </div>

      <div id="home-cards"></div>
      <p class="credit">정보 출처: 한국관광공사</p>
    </section>

    <!-- 지도 -->
    <section id="map" class="page map-page" aria-label="지도" hidden>
      <div id="map-canvas"></div>

      <div class="map-chips" role="group" aria-label="장소 종류">
        <button class="chip on" type="button" data-type="food">맛집</button>
        <button class="chip" type="button" data-type="spot">관광지</button>
        <button class="chip" type="button" data-type="festival">축제</button>
      </div>
      <div id="map-notice" class="map-notice" role="status" hidden></div>

      <button id="search-here" class="map-btn search-here" type="button" hidden>이 지역에서 다시 찾기</button>
      <button id="locate-btn" class="map-btn locate-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        현재 위치로 이동
      </button>

      <div class="sheet">
        <div class="sheet-head"><span id="sheet-title">주변 장소</span><span id="sheet-count"></span></div>
        <div id="sheet-body" class="sheet-body"></div>
      </div>

      <div id="map-error" class="placeholder map-error" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <b>지도를 표시할 수 없어요</b>
        <p id="map-error-text"></p>
        <button id="map-retry" class="btn" type="button">다시 시도</button>
      </div>
    </section>

    <!-- 즐겨찾기 -->
    <section id="favorites" class="page" aria-label="즐겨찾기" hidden>
      <h1 class="greeting">즐겨찾기</h1>
      <div id="favorites-list"></div>
    </section>

    <!-- 내 정보 -->
    <section id="me" class="page" aria-label="내 정보" hidden>
      <h1 class="greeting">내 정보</h1>
      <ul class="menu-list">
        <li>위치 사용 안내</li>
        <li>데이터 출처 (한국관광공사 · 네이버 · 기상청)</li>
        <li>앱 정보 (버전 0.1)</li>
      </ul>
    </section>

    <!-- 장소 상세 -->
    <section id="place" class="page" aria-label="장소 상세" hidden>
      <button id="place-back" class="back-btn" type="button">← 뒤로</button>
      <div id="place-body"></div>
    </section>
  </main>

  <!-- 하단 메뉴 -->
  <nav class="tabbar" aria-label="하단 메뉴">
    <a href="#home" class="tab" data-page="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9h-6v-6H9v6H3z"/></svg>홈
    </a>
    <a href="#map" class="tab" data-page="map">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>지도
    </a>
    <a href="#favorites" class="tab" data-page="favorites">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.7A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/></svg>즐겨찾기
    </a>
    <a href="#me" class="tab" data-page="me">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>내 정보
    </a>
  </nav>

  <script src="config.js"></script>
  <script src="location.js"></script>
  <script src="api.js"></script>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="ui.js"></script>
  <script src="favorites.js"></script>
  <script src="map.js"></script>
  <script src="detail.js"></script>
  <script src="app.js"></script>
</body>
</html>
